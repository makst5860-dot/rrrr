name: Пошук тістомісів

on:
  schedule:
    # ~48 перевірок на добу з нерівними проміжками (12–46 хв) — вистачає безкоштовних 2000 хв/міс.
    # для приватного репозиторію. GitHub ще й сам запускає з випадковою затримкою на кілька хвилин.
    - cron: '4,33 0-23/2 * * *'
    - cron: '19,52 1-23/2 * * *'
  workflow_dispatch:
    inputs:
      test_push:
        description: 'Надіслати тестове сповіщення на iPhone'
        type: boolean
        default: false
      debug:
        description: 'Детальний лог (без сповіщень і без збереження)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev --no-audit --no-fund

      - name: Пошук і сповіщення
        run: node scanner/index.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEBUG: ${{ inputs.debug }}
          TEST_PUSH: ${{ inputs.test_push }}

      - name: Зберегти знайдене
        if: ${{ !inputs.debug }}
        run: |
          git config user.name "tistomis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -q -m "Оновлення оголошень"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep $(( 5 * i ))
          done
          exit 1
